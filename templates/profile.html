{% extends 'base.html' %}
{% block title %}Profile | DROPoutpreneur{% endblock %}
{% block content %}<section class="page-intro"><p class="kicker">Your profile</p><h1>Make this journey<br><em>feel like yours.</em></h1></section><section class="profile-grid"><form class="form-panel" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>Profile details</h2><label>Name<input name="name" value="{{ current_user['name'] }}" required></label><label>Email<input value="{{ current_user['email'] }}" disabled></label><label>Career goal<input name="career_goal" value="{{ current_user['career_goal'] }}" placeholder="e.g. Build web products"></label><button class="button" type="submit">Save profile</button></form><div class="panel"><p class="kicker">Your progress</p>{% for key,stat in stats.items() %}<div class="progress-line"><span>{{ key|title }}</span><b>{{ stat[2] }}%</b><div class="progress"><i style="width:{{ stat[2] }}%"></i></div></div>{% endfor %}</div></section>{% endblock %}
